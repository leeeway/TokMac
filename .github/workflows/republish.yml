name: Republish Existing Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Build & Release run containing the packages'
        required: true
        type: string
      tag_name:
        description: 'Existing release tag to replace, without changing its version'
        required: true
        default: 'v1.0.0'
        type: string
      allow_unnotarized:
        description: 'Explicitly publish an ad-hoc macOS build and add a notarization notice'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: republish-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag_name }}
      ALLOW_UNNOTARIZED: ${{ inputs.allow_unnotarized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      - name: Verify build, source, and existing release
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(cat VERSION)" == "${RELEASE_TAG#v}" ]]
          [[ "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" == success ]]
          [[ "$(gh run view "$BUILD_RUN_ID" --json workflowName --jq .workflowName)" == 'Build & Release (macOS & Windows)' ]]
          [[ "$(gh run view "$BUILD_RUN_ID" --json headSha --jq .headSha)" == "$(git rev-parse HEAD)" ]]
          gh release view "$RELEASE_TAG" >/dev/null
      - name: Download verified packages
        run: |
          gh run download "$BUILD_RUN_ID" --name macos-dmg --dir release_assets
          gh run download "$BUILD_RUN_ID" --name windows-binaries --dir release_assets
      - name: Verify release packages and explicit signing policy
        run: |
          args=(release_assets "${RELEASE_TAG#v}")
          if [[ "$ALLOW_UNNOTARIZED" == true ]]; then args+=(--allow-unnotarized); fi
          python3 scripts/verify-release.py "${args[@]}"
      - name: Mark explicitly authorized unnotarized release
        if: inputs.allow_unnotarized
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.txt
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('release-notes.txt')
          notice = '> macOS 提示：本次安装包使用 ad-hoc 开发签名，尚未经过 Apple 公证；首次启动可能被 Gatekeeper 阻止。\n\n'
          body = notes.read_text()
          if not body.startswith(notice):
              notes.write_text(notice + body)
          PY
          gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
      - name: Replace existing release packages
        run: |
          version="${RELEASE_TAG#v}"
          files=("release_assets/TokMac-${version}.dmg" "release_assets/TokMac-Setup-${version}.exe" "release_assets/TokMac-Windows-Portable.zip")
          for file in "${files[@]}"; do test -s "$file"; done
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
