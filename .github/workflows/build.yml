name: Build & Release (macOS & Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared browser script
        run: node --test tests/scripts.test.cjs
      - name: Test release validation
        run: |
          python3 tests/release_validation_test.py
          python3 tests/replace_release_assets_test.py
          python3 tests/signing_flow_test.py

  build-macos:
    name: Test & Build macOS DMG
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      TOKMAC_SIGNING_MODE: development
    steps:
      - uses: actions/checkout@v4
      - name: Configure Developer ID signing and notarization
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./.github/scripts/configure-macos-signing.sh
      - name: Test download validation and file safety
        run: ./tests/run-swift-tests.sh --webkit
      - name: Build macOS App & DMG
        run: ./create_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            build/TokMac-*.dmg
            build/macos-release-status.json
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/tokmac-signing/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/tokmac-signing"

  build-windows:
    name: Test & Build Windows App & Installer
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test download file safety
        run: dotnet run --project tests/windows/DownloadFileTests.csproj -c Release
      - name: Test native full screen and window restoration
        run: dotnet run --project tests/windows-ui/WindowTests.csproj -c Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Publish Windows Standalone Executable
        run: dotnet publish windows/TokMac.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:APP_VERSION -o build_win
      - name: Build Inno Setup Installer & Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_installer
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:APP_VERSION" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build_win/TokMac.exe -DestinationPath build_installer/TokMac-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build_installer/TokMac-Setup-*.exe
            build_installer/TokMac-Windows-Portable.zip
          if-no-files-found: error

  publish-release:
    name: Publish Tagged Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release_assets/
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release_assets/
      - name: Verify signed release packages
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/verify-release.py release_assets "$APP_VERSION"
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Published releases are immutable from CI; never replace their attachments.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its assets."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "release_assets/TokMac-${version}.dmg" "release_assets/TokMac-Setup-${version}.exe" release_assets/TokMac-Windows-Portable.zip --verify-tag --title "TokMac $RELEASE_TAG" --generate-notes
